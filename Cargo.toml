[workspace]
resolver = "2"
members = [
    "crates/adb",
    "crates/protocol",
    "crates/media",
    "crates/input",
    "crates/transport",
    "crates/session",
    "crates/player"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["PhoneMirror Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
